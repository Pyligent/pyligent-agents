name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests examples
      # No ANTHROPIC_API_KEY is set anywhere in CI. The suite runs against the
      # deterministic backend, so CI needs no credential and spends nothing.
      - run: pytest

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: python examples/run.py demo all
      - name: scaffold builds and its tests pass
        run: |
          python -m trellis new /tmp/scaffold_check
          cd /tmp/scaffold_check && pip install pytest && python -m pytest -q
