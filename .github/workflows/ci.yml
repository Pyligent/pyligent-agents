name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests examples evals bench
      # No ANTHROPIC_API_KEY is set anywhere in CI. The suite runs against the
      # deterministic backend, so CI needs no credential and spends nothing.
      - run: pytest

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: python examples/run.py demo all
      - name: the evidence checker runs from a clean install
        run: |
          evidence-check --version
          python -m pytest tests/test_evidencecheck_checks.py -q
      - name: the benchmark harness runs with no credential
        # The synthetic corpus proves the harness works. It proves nothing about
        # any model, and its provenance line says so in the output.
        run: python bench/run.py --corpus bench/corpus-synthetic
      - name: evals do not regress against the committed baselines
        # Fails the build on ANY new false accept. The tolerance for letting a
        # flawed document through is zero; see evals/README.md.
        run: |
          for persona in faithful paraphraser helpful sloppy; do
            python evals/run_evals.py --system "$persona" --check
          done
      - name: scaffold builds and its tests pass
        run: |
          python -m pyligent_agents new /tmp/scaffold_check
          cd /tmp/scaffold_check && pip install pytest && python -m pytest -q
