[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyligent-agents"
version = "0.2.0"
description = "Harness, loop and graph engineering for production AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["agents", "llm", "orchestration", "context-engineering", "anthropic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# The core library has NO required third-party dependencies. That is deliberate:
# a structural layer you cannot adopt because of its dependency tree is a layer
# nobody adopts.
# Back to none. `evidencecheck` now lives in this tree and ships as its own
# distribution from it — one definition of the evidence checks, one repository,
# and still an `evidence-check` command for people who want the checker and not
# the framework.
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.69"]
# PDF ingestion for the evidence checker. Docling is MIT, runs on CPU, and
# is strong on the financial tables where haircut matrices live.
pdf = ["docling>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/pyligent/pyligent-agents"
Documentation = "https://github.com/pyligent/pyligent-agents/tree/main/docs"
Issues = "https://github.com/pyligent/pyligent-agents/issues"
Changelog = "https://github.com/pyligent/pyligent-agents/blob/main/CHANGELOG.md"

[project.scripts]
"pyligent-agents" = "pyligent_agents.cli:main"
"evidence-check" = "evidencecheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "examples", "evals"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["examples/**/policy.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM108"]
