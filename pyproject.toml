[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyligent-agents"
version = "0.1.0"
description = "Harness, loop and graph engineering for production AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["agents", "llm", "orchestration", "context-engineering", "anthropic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# The core library has NO required third-party dependencies. That is deliberate:
# a structural layer you cannot adopt because of its dependency tree is a layer
# nobody adopts.
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.69"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/pyligent/pyligent-agents"
Documentation = "https://github.com/pyligent/pyligent-agents/tree/main/docs"
Issues = "https://github.com/pyligent/pyligent-agents/issues"
Changelog = "https://github.com/pyligent/pyligent-agents/blob/main/CHANGELOG.md"

[project.scripts]
"pyligent-agents" = "pyligent_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "examples"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["examples/**/policy.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM108"]
